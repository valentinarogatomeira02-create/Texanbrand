<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texan Tech</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #031a33;
            font-family: Arial, sans-serif;
        }

        .pagina {
            text-align: center;
            animation: aparecer 1.5s ease;
        }

        h1 {
            color: white;
            font-size: clamp(2rem, 7vw, 4.5rem);
            margin-bottom: 40px;
            text-shadow: 0 0 20px #008cff;
        }

        .entrar {
            display: inline-block;
            padding: 16px 45px;
            background: #007bff;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 0 20px #007bff;
            transition: 0.3s;
        }

        .entrar:hover {
            background: #00a2ff;
            transform: scale(1.08);
            box-shadow: 0 0 35px #00a2ff;
        }

        .entrar:active {
            transform: scale(0.95);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="pagina">

        <h1>Bem-Vindo(a) a Texan Tech!!</h1>

        <!-- TROQUE O LINK ABAIXO -->
        <a
            class="entrar"
            href="https://SEU-LINK-AQUI.com"
        >
            ENTRAR
        </a>

    </div>

</body>
</html>
