
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Texan Tech</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 20% 30%, rgba(80, 150, 255, 0.08) 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(140, 80, 255, 0.07) 0%, transparent 25%),
                radial-gradient(circle at 60% 15%, rgba(0, 180, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at center, #063b72 0%, #021a35 45%, #010b18 100%);

            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            animation: fadeIn 1.5s ease forwards;
        }

        .titulo {
            color: #ffffff;
            font-size: clamp(2rem, 6vw, 4.5rem);
            font-weight: 700;
            letter-spacing: 1px;

            text-shadow:
                0 0 10px rgba(103, 173, 220, 0.7),
                0 0 25px rgba(0, 153, 255, 0.4);

            margin-bottom: 45px;
        }

        .botao {
            display: inline-block;
            padding: 16px 45px;

            background: linear-gradient(135deg, #007bff, #0052b8);
            color: #ffffff;

            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;

            box-shadow:
                0 0 15px rgba(0, 123, 255, 0.5),
                0 8px 25px rgba(0, 0, 0, 0.3);

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .botao:hover {
            transform: translateY(-4px) scale(1.03);

            background: linear-gradient(135deg, #6990b0, #325276);

            box-shadow:
                0 0 25px rgba(0, 153, 255, 0.8),
                0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .botao:active {
            transform: scale(0.96);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .titulo {
                font-size: 2.2rem;
                line-height: 1.2;
            }

            .botao {
                padding: 14px 35px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1 class="titulo">
            Bem-Vindo(a) a Texan Tech!!
        </h1>

        <a
            class="botao"
            href="COLE_SEU_LINK_AQUI"
        >
            ENTRAR
        </a>

    </main>

</body>
</html>
